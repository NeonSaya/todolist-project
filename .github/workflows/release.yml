name: Release Windows desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "拾序 v__VERSION__"
          releaseBody: |
            拾序 Windows 独立版 v__VERSION__。

            - AI 设置可切换 OpenAI Responses、Anthropic Messages 和 OpenAI Chat Completions
            - 新配置默认使用 OpenAI Chat Completions，旧配置无需重新填写
            - 智能添加兼容 DeepSeek 的 Responses 与 Anthropic 接口

            下载 `Shixu_*_x64-setup.exe`，双击安装后从开始菜单打开。安装包目前未做代码签名，Windows SmartScreen 可能提示；可选择“更多信息”后继续运行。系统缺少 WebView2 时，安装程序会联网下载运行时。
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm desktop
          args: --bundles nsis
          assetNamePattern: "Shixu_[version]_[arch][setup][ext]"

      - name: Remove legacy release asset name
        if: github.ref_name == 'v0.1.0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete-asset v0.1.0 "_0.1.0_x64-setup.exe" --yes
